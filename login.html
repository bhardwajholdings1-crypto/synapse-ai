<!DOCTYPE html>
<html lang="en">

<body class="login-body">

<div class="vignette"></div>

<div class="login-rings">
  <div class="ring"></div><div class="ring"></div>
  <div class="ring"></div><div class="ring"></div>
</div>

<div class="login-box hud-box" id="login-box">
  <div class="login-symbol">◈</div>
  <div class="login-title">SYNAPSE AI</div>
  <div class="login-sub">INTELLIGENCE FORGED IN THE VOID</div>
  <div class="login-initiative">A BhardwajTechnologieS Initiative</div>

  <!-- LOGIN FORM -->

    <div class="login-links">

    <div class="input-group">
      <label class="input-label">EMAIL ADDRESS</label>
      <input class="input-field" type="email" id="signup-email" placeholder="your@email.com"/>
    </div>
    <div class="input-group">
      <label class="input-label">PASSWORD</label>
      <input class="input-field" type="password" id="signup-password" placeholder="Min 6 characters"/>
    </div>
    <button class="login-btn" id="signup-btn">CREATE ACCOUNT</button>
    <div class="login-links">

    </div>
    <div class="login-error" id="signup-error"></div>

<!-- ✏️ SUPABASE — replace with your URL and anon key from supabase.com -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// ✏️ PASTE YOUR SUPABASE CREDENTIALS HERE
const SUPABASE_URL  = 'HTTPS://PXXEAQTGHJQZSIQLHTME.SUPABASE.CO'   // e.g. https://xxxx.supabase.co
const SUPABASE_ANON = 'sb_publishable_bbL0XiXl_CEEPQ1dNfjViQ_zUGDU3c1'

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON)

// Check if already logged in
const { data: { session } } = await supabase.auth.getSession()
if (session) window.location.href = 'app.html'

function showError(id, msg) {
  const el = document.getElementById(id)
  el.textContent = '⚠ ' + msg; el.style.display = 'block'
}
function hideError(id) { document.getElementById(id).style.display = 'none' }

// LOGIN
document.getElementById('login-btn').addEventListener('click', async () => {
  const email    = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  hideError('login-error')
  if (!email || !password) return showError('login-error', 'Please fill all fields')
  document.getElementById('login-btn').textContent = 'CONNECTING...'
  document.getElementById('login-btn').disabled = true
  const { error } = await supabase.auth.signInWithPassword({ email, password })
  if (error) {
    showError('login-error', error.message)
    document.getElementById('login-btn').textContent = 'ENTER SYNAPSE'
    document.getElementById('login-btn').disabled = false
  } else {
    window.location.href = 'app.html'
  }
})

// SIGNUP
document.getElementById('signup-btn').addEventListener('click', async () => {
  const email    = document.getElementById('signup-email').value.trim()
  const password = document.getElementById('signup-password').value
  hideError('signup-error')
  if (!email || !password) return showError('signup-error', 'Please fill all fields')
  if (password.length < 6) return showError('signup-error', 'Password must be at least 6 characters')
  document.getElementById('signup-btn').textContent = 'CREATING...'
  document.getElementById('signup-btn').disabled = true
  const { error } = await supabase.auth.signUp({ email, password })
  if (error) {
    showError('signup-error', error.message)
    document.getElementById('signup-btn').textContent = 'CREATE ACCOUNT'
    document.getElementById('signup-btn').disabled = false
  } else {
    showError('signup-error', '✓ Check your email to confirm your account')
    document.getElementById('signup-error').style.color = 'var(--green)'
  }
})

// FORGOT PASSWORD
document.getElementById('forgot-btn').addEventListener('click', async () => {
  const email = document.getElementById('forgot-email').value.trim()
  if (!email) return showError('forgot-msg', 'Enter your email')
  await supabase.auth.resetPasswordForEmail(email)
  document.getElementById('forgot-msg').textContent = '✓ Reset link sent — check your email'
  document.getElementById('forgot-msg').style.color = 'var(--green)'
  document.getElementById('forgot-msg').style.display = 'block'
})

// FORM SWITCHING
function showForm(name) {
  ['login-form','signup-form','forgot-form'].forEach(f => document.getElementById(f).style.display = 'none')
  document.getElementById(name).style.display = 'block'
}
document.getElementById('to-signup').addEventListener('click', () => showForm('signup-form'))
document.getElementById('to-forgot').addEventListener('click', () => showForm('forgot-form'))
document.getElementById('to-login').addEventListener('click',  () => showForm('login-form'))
document.getElementById('to-login2').addEventListener('click', () => showForm('login-form'))
</script>

<script>
// Starfield
const canvas = document.getElementById('starfield')
const ctx = canvas.getContext('2d')
let stars = []
function init() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight
  stars = Array.from({length: 150}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    r: Math.random() * 1.2, speed: Math.random() * 0.2 + 0.05, opacity: Math.random()
  }))
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  stars.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2)
    ctx.fillStyle = `rgba(232,213,255,${s.opacity})`; ctx.fill()
    s.y += s.speed; s.opacity = 0.2 + 0.8 * Math.sin(Date.now()*0.001 + s.x)
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width }
  })
  requestAnimationFrame(draw)
}
init(); draw()
window.addEventListener('resize', init)

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
}
</script>
</body>
</html>
